<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArtNode</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@300;400&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      background: #f7f6f4;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }
    .login-wrap { width: 100%; max-width: 360px; padding: 24px; }
    .login-logo { text-align: center; margin-bottom: 48px; }
    .login-logo img { width: 160px; display: inline-block; }
    .login-box { background: #ffffff; border: 1px solid #e4e2de; padding: 40px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase; color: #9a9a9a; margin-bottom: 6px; }
    input[type="email"], input[type="password"] { width: 100%; padding: 10px 12px; border: 1px solid #e4e2de; background: #fafafa; font-family: 'DM Sans', sans-serif; font-size: 0.88rem; font-weight: 300; color: #181714; outline: none; transition: border-color 0.15s; }
    input[type="email"]:focus, input[type="password"]:focus { border-color: #181714; background: #ffffff; }
    .remember-row { display: flex; align-items: center; gap: 8px; margin-bottom: 28px; }
    input[type="checkbox"] { width: 14px; height: 14px; accent-color: #181714; cursor: pointer; }
    .remember-row label { font-size: 0.78rem; letter-spacing: 0.02em; text-transform: none; color: #6b6760; margin: 0; cursor: pointer; }
    .btn-login { width: 100%; padding: 12px; background: #181714; color: #ffffff; border: none; font-family: 'DM Sans', sans-serif; font-size: 0.78rem; font-weight: 400; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; transition: background 0.15s; }
    .btn-login:hover { background: #3a3830; }
    .error-msg { background: #fdecea; color: #c0392b; border-left: 3px solid #c0392b; padding: 10px 14px; font-size: 0.82rem; margin-bottom: 20px; }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-logo">
      <img src="/static/img/logo_artnode.png" alt="ArtNode">
    </div>
    <div class="login-box">
      <form method="POST" action="/login">
        {{ login_user_form.hidden_tag() if login_user_form else "" }}
        {% if login_user_form and login_user_form.errors %}
        <div class="error-msg">Invalid email or password.</div>
        {% endif %}
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autofocus autocomplete="email" required value="admin@artnode.ch">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required value="artnode2024">
        </div>
        <div class="remember-row">
          <input type="checkbox" id="remember" name="remember">
          <label for="remember">Remember me</label>
        </div>
        <button type="submit" class="btn-login">Sign In</button>
      </form>
    </div>
  </div>
</body>
</html>
