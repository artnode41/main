{% extends "base.html" %}
{% block title %}{% if post %}Edit Post{% else %}New Post{% endif %} — ArtNode{% endblock %}
{% block content %}
<div class="page-header">
  <div>
    <a href="{{ url_for('blog.index') }}" style="font-size:0.75rem;color:var(--text-muted);letter-spacing:0.06em;text-transform:uppercase;">&larr; Blog</a>
    <div class="page-title" style="margin-top:4px;">{% if post %}Edit Post{% else %}New Post{% endif %}</div>
  </div>
</div>
<div class="page-body">
  <form method="POST" action="">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div style="max-width:720px;">
      <div style="background:var(--surface);border:1px solid var(--border);padding:var(--space-xl);margin-bottom:var(--space-lg);">
        <div class="form-group">
          <label class="form-label">Title *</label>
          <input type="text" name="title" class="form-control" value="{{ post.title if post else '' }}" required>
        </div>
        <div class="form-group">
          <label class="form-label">Body *</label>
          <textarea name="body" class="form-control" rows="20" required
                    style="font-family:monospace;font-size:0.85rem;">{{ post.body if post else '' }}</textarea>
          <p style="font-size:0.72rem;color:var(--text-muted);margin-top:4px;">Plain text or basic HTML supported.</p>
        </div>
        <label style="display:flex;align-items:center;gap:10px;cursor:pointer;font-size:0.88rem;">
          <input type="checkbox" name="is_published" style="width:16px;height:16px;"
                 {% if post and post.is_published %}checked{% endif %}>
          Published (visible on public site)
        </label>
      </div>
      <div style="display:flex;gap:var(--space-md);justify-content:flex-end;">
        <a href="{{ url_for('blog.index') }}" class="btn btn-secondary">Cancel</a>
        <button type="submit" class="btn btn-primary">{% if post %}Save Changes{% else %}Create Post{% endif %}</button>
      </div>
    </div>
  </form>
</div>
{% endblock %}
