<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ gallery.public_name or gallery.name }}</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      padding: 40px 20px; text-align: center;
    }
    .logo { margin-bottom: 32px; }
    .logo img { max-height: 60px; width: auto; }
    .name { font-size: 1.1rem; font-weight: 400; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 16px; color: #1a1a1a; }
    .message { font-size: 0.85rem; color: #888; line-height: 1.7; max-width: 360px; }
  </style>
</head>
<body>
  <div class="logo">
    {% if gallery.logo_url %}
    <img src="{{ gallery.logo_url }}" alt="{{ gallery.public_name or gallery.name }}">
    {% else %}
    <div class="name">{{ gallery.public_name or gallery.name }}</div>
    {% endif %}
  </div>
  <p class="message">We are currently undergoing scheduled maintenance.<br>Please check back later.</p>
</body>
</html>
