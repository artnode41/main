{% extends "public/base.html" %}
{% block title %}{{ post.title }} — {{ gallery.public_name or gallery.name }}{% endblock %}
{% block content %}
<div class="pub-container" style="max-width:720px;margin:0 auto;padding:60px 24px;">
  <a href="{{ url_for('public.blog') }}" style="font-size:0.72rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);text-decoration:none;">&larr; Blog</a>
  <div style="margin-top:32px;">
    <div style="font-size:0.72rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);margin-bottom:12px;">
      {{ post.published_at|ch_date if post.published_at else "" }}
    </div>
    <h1 style="font-family:var(--font-serif);font-size:2rem;font-weight:300;margin:0 0 40px;line-height:1.2;">{{ post.title }}</h1>
    <div style="font-size:0.92rem;line-height:1.9;color:var(--text);">
      {{ post.body|safe }}
    </div>
  </div>
</div>
{% endblock %}
